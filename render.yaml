# Деплой на https://render.com без SSH (см. RAZVERNYVANIE-PROSTO.md)
services:
  - type: web
    name: sber-pomoshnik
    runtime: node
    plan: free
    # Импорт SQLite ~6 GB; на free tier может не хватить RAM — тогда поиск идёт по CSV
    buildCommand: npm run zalog:install && (node scripts/import-deals-sqlite.mjs || echo "deals sqlite import skipped")
    startCommand: npm start
    healthCheckPath: /api/zalog/health
    envVars:
      - key: GIGACHAT_SCOPE
        value: GIGACHAT_API_PERS
      - key: GIGACHAT_MODEL
        value: GigaChat
      - key: NODE_VERSION
        value: "22"
      - key: GIGACHAT_CREDENTIALS
        sync: false
      - key: GIGACHAT_ENABLED
        value: "true"
      - key: LANGFLOW_API_KEY
        sync: false
      - key: LANGFLOW_RUN_URL
        sync: false
      - key: NSPD_BASES
        sync: false
      - key: NSPD_PROXY_KEY
        sync: false
      # URL отдельного сервиса UpGrade (плашка /upgrade)
      - key: UPGRADE_PUBLIC_URL
        value: https://sber-upgrade.onrender.com

  - type: web
    name: sber-upgrade
    runtime: java
    plan: free
    rootDir: upgrade
    buildCommand: ./mvnw -DskipTests package
    startCommand: java -jar target/upgrade-0.1.0-SNAPSHOT.jar
    healthCheckPath: /login
    envVars:
      - key: JAVA_VERSION
        value: "17"
      - key: SPRING_DATASOURCE_URL
        value: jdbc:h2:file:./data/upgrade;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
