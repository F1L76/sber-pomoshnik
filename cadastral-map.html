<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Карта объектов по списку КН — СберБизнес Помощник</title>
    <script>(function(){try{if(localStorage.getItem("sber-pomoshnik:theme")==="dark")document.documentElement.setAttribute("data-theme","dark");}catch(e){}})();</script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link href="https://fonts.cdnfonts.com/css/sb-sans-interface" rel="stylesheet">
    <style>
        :root {
            --sber-green: #21A038;
            --sber-bg: #F0F4F8;
            --sber-card: #FFFFFF;
            --sber-text: #1E2A3A;
            --sber-muted: #617188;
            --sber-border: #E2EAF2;
            --radius: 20px;
        }
        html, body { height: 100%; }
        body {
            font-family: 'SB Sans Interface', system-ui, sans-serif;
            background: var(--sber-bg);
            color: var(--sber-text);
            margin: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        .hero {
            background: linear-gradient(135deg, #1E2A3A 0%, #243447 100%);
            color: #fff;
            border-bottom: 3px solid var(--sber-green);
            padding: 1.25rem 0;
            flex-shrink: 0;
        }
        .hero a { color: inherit; text-decoration: none; }
        #map {
            flex: 1;
            min-height: 420px;
            z-index: 0;
        }
        .stat-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem 1.25rem;
            align-items: center;
            padding: 0.7rem 0;
            font-size: 0.9rem;
        }
        .stat-bar strong { font-variant-numeric: tabular-nums; }
        .toolbar {
            background: var(--sber-card);
            border-bottom: 1px solid var(--sber-border);
            flex-shrink: 0;
        }
        .progress { height: 6px; }
        .marker-cluster-small { background: rgba(33, 160, 56, 0.28); }
        .marker-cluster-small div { background: rgba(33, 160, 56, 0.72); color: #fff; }
        .marker-cluster-medium { background: rgba(33, 160, 56, 0.32); }
        .marker-cluster-medium div { background: rgba(27, 138, 50, 0.82); color: #fff; }
        .marker-cluster-large { background: rgba(30, 42, 58, 0.28); }
        .marker-cluster-large div { background: #1E2A3A; color: #fff; }
        .type-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
    </style>
    <link rel="stylesheet" href="/theme.css?v=13">
</head>
<body>
    <header class="hero">
        <div class="container-fluid px-4">
            <div class="d-flex flex-wrap align-items-center justify-content-between gap-3">
                <div>
                    <p class="small mb-1 opacity-75"><a href="/">СберБизнес Помощник</a> · сопровождение 2.0</p>
                    <h1 class="h4 mb-0"><i class="fa-solid fa-map me-2 text-success"></i>Карта объектов по списку КН</h1>
                </div>
                <div class="d-flex flex-wrap align-items-center gap-2">
                    <div class="theme-toggle-standalone">
                        <div class="form-check form-switch theme-toggle-wrap mb-0" title="Светлая или тёмная тема">
                            <input class="form-check-input" type="checkbox" role="switch" id="themeToggle" data-theme-toggle>
                            <label class="form-check-label" for="themeToggle">
                                <i class="fas fa-moon theme-toggle-icon" data-theme-icon aria-hidden="true"></i>
                                <span data-theme-label>Светлая</span>
                            </label>
                        </div>
                    </div>
                    <a href="/geocode-progress" class="btn btn-outline-light btn-sm">Ход геокодирования</a>
                    <a href="/cadastral" class="btn btn-outline-light btn-sm">Поиск по КН</a>
                    <a href="/?view=services" class="btn btn-outline-light btn-sm">← СберБизнес Помощник</a>
                </div>
            </div>
        </div>
    </header>
    <div class="toolbar">
        <div class="container-fluid px-4">
            <div class="stat-bar">
                <span>В списке <strong id="statTotal">—</strong></span>
                <span>с координатами <strong id="statOk">—</strong></span>
                <span>без точки <strong id="statFail">—</strong></span>
                <span id="statRun" class="text-muted"></span>
                <label class="ms-auto d-flex align-items-center gap-2 mb-0">
                    <span class="text-muted">Тип</span>
                    <select id="typeFilter" class="form-select form-select-sm" style="width:auto;min-width:12rem">
                        <option value="">все</option>
                    </select>
                </label>
                <button type="button" class="btn btn-sm btn-outline-secondary" id="fitAllBtn">Показать все</button>
            </div>
            <div class="progress mb-2" id="progressWrap" hidden>
                <div class="progress-bar bg-success" id="progressBar" style="width:0%"></div>
            </div>
        </div>
    </div>
    <div id="map" role="region" aria-label="Карта объектов недвижимости"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
    <script>
        const TYPE_COLOR = {
            "Помещения": "#21A038",
            "Здания": "#1B8A32",
            "Земельные участки ЕГРН": "#0F6B4A",
            "Машино-места": "#0098F8",
            "Сооружения": "#617188",
            "Сооружения ЕГРН": "#617188",
            "Объекты незавершённого строительства": "#c47a00"
        };
        function colorFor(type) { return TYPE_COLOR[type] || "#21A038"; }

        const map = L.map("map", { scrollWheelZoom: true });
        map.attributionControl.setPrefix("Leaflet");
        const scheme = L.tileLayer(
            "https://{s}.tile.openstreetmap.fr/hot/{z}/{x}/{y}.png",
            { maxZoom: 19, subdomains: "abc", attribution: "© OpenStreetMap" }
        );
        const satellite = L.tileLayer(
            "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
            { maxZoom: 19, attribution: "© Esri" }
        );
        satellite.addTo(map);
        L.control.layers({ "Схема": scheme, "Спутник": satellite }).addTo(map);
        map.setView([55.75, 37.62], 5);

        const cluster = L.markerClusterGroup({
            chunkedLoading: true,
            chunkInterval: 50,
            spiderfyOnMaxZoom: true,
            disableClusteringAtZoom: 18,
            maxClusterRadius: 48
        });
        map.addLayer(cluster);

        let allPoints = [];
        let lastOk = -1;
        let didFit = false;

        function escapeHtml(s) {
            return String(s || "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
        }

        function renderPoints(typeFilter) {
            cluster.clearLayers();
            const filter = typeFilter || "";
            const layers = [];
            for (const p of allPoints) {
                if (filter && p.t !== filter) continue;
                const marker = L.circleMarker([p.lat, p.lon], {
                    radius: 7,
                    color: colorFor(p.t),
                    fillColor: colorFor(p.t),
                    fillOpacity: 0.85,
                    weight: 1
                });
                marker.bindPopup(
                    `<div style="min-width:220px">
                        <div class="fw-semibold">${escapeHtml(p.kn)}</div>
                        <div class="small text-muted">${escapeHtml(p.t || "объект")}${p.src === "kadbase" ? " · примерно по адресу" : ""}</div>
                        <div class="small mt-1">${p.lat.toFixed(6)}, ${p.lon.toFixed(6)}</div>
                        <div class="mt-2 d-flex gap-2">
                            <a href="/cadastral?kn=${encodeURIComponent(p.kn)}">Карточка</a>
                            <a href="https://nspd.gov.ru/map?thematic=PKK&zoom=18&lat=${p.lat}&lon=${p.lon}&cadastralNumber=${encodeURIComponent(p.kn)}" target="_blank" rel="noopener">НСПД</a>
                        </div>
                    </div>`
                );
                layers.push(marker);
            }
            cluster.addLayers(layers);
            if (layers.length && !didFit) {
                map.fitBounds(cluster.getBounds().pad(0.08));
                didFit = true;
            }
        }

        function fillTypeFilter(types) {
            const sel = document.getElementById("typeFilter");
            const current = sel.value;
            const entries = Object.entries(types || {}).sort((a, b) => b[1] - a[1]);
            sel.innerHTML = `<option value="">все (${Object.values(types || {}).reduce((s, n) => s + n, 0)})</option>` +
                entries.map(([name, n]) => `<option value="${escapeHtml(name)}">${escapeHtml(name)} (${n})</option>`).join("");
            if ([...sel.options].some((o) => o.value === current)) sel.value = current;
        }

        function formatEta(sec) {
            if (sec == null || !Number.isFinite(Number(sec)) || Number(sec) < 0) return "";
            let s = Math.round(Number(sec));
            const d = Math.floor(s / 86400);
            s %= 86400;
            const h = Math.floor(s / 3600);
            const m = Math.round((s % 3600) / 60);
            const parts = [];
            if (d) parts.push(`${d} д`);
            if (h) parts.push(`${h} ч`);
            if (m || !parts.length) parts.push(`${m} мин`);
            return ` · осталось ${parts.join(" ")}`;
        }

        function renderStatus(status) {
            const total = status.total || 0;
            const done = status.done || 0;
            const ok = status.ok || 0;
            const fail = status.fail || 0;
            document.getElementById("statTotal").textContent = total.toLocaleString("ru-RU");
            document.getElementById("statOk").textContent = ok.toLocaleString("ru-RU");
            document.getElementById("statFail").textContent = fail.toLocaleString("ru-RU");
            const run = document.getElementById("statRun");
            const wrap = document.getElementById("progressWrap");
            const bar = document.getElementById("progressBar");
            if (status.running && total) {
                wrap.hidden = false;
                bar.style.width = `${Math.round((done / total) * 100)}%`;
                run.textContent = `геокодирование НСПД… ${done.toLocaleString("ru-RU")} / ${total.toLocaleString("ru-RU")}${formatEta(status.etaSec)}`;
            } else {
                wrap.hidden = done > 0 && done < total ? false : true;
                if (done && total) bar.style.width = `${Math.round((done / total) * 100)}%`;
                run.textContent = done && done >= total ? "геокодирование завершено" : (done ? "геокодирование остановлено" : "координат пока нет — запустите npm run geocode-list");
            }
        }

        async function loadPoints() {
            const res = await fetch("/api/cadastral-map/points");
            const data = await res.json();
            allPoints = data.points || [];
            lastOk = data.status?.ok ?? allPoints.length;
            renderStatus(data.status || {});
            fillTypeFilter(data.types || {});
            renderPoints(document.getElementById("typeFilter").value);
        }

        document.getElementById("typeFilter").addEventListener("change", (e) => {
            renderPoints(e.target.value);
        });
        document.getElementById("fitAllBtn").addEventListener("click", () => {
            if (cluster.getLayers().length) map.fitBounds(cluster.getBounds().pad(0.08));
        });

        async function pollStatus() {
            try {
                const res = await fetch("/api/cadastral-map/status");
                const status = await res.json();
                renderStatus(status);
                const ok = status.ok || 0;
                if (ok !== lastOk && (ok - lastOk >= 50 || !status.running)) {
                    await loadPoints();
                }
            } catch {
                /* ignore */
            }
        }

        loadPoints().catch((err) => {
            document.getElementById("statRun").textContent = err.message || "не удалось загрузить точки";
        });
        setInterval(pollStatus, 4000);
    </script>
    <script src="/theme.js?v=2"></script>
</body>
</html>
